<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0a84ff;--blue-soft:rgba(10,132,255,.12);--red:#ff375f;--green:#30d158;
  --text:#1c1c1e;--sub:#6e6e73;--faint:#a1a1a6;--sep:rgba(60,60,67,.12);
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.78);--glass-soft:rgba(255,255,255,.32);
  --stroke:rgba(255,255,255,.75);--shadow:0 10px 40px rgba(40,60,120,.14),0 1px 2px rgba(40,60,120,.08);
  --blur:blur(28px) saturate(180%);--radius:16px;--bg:#dde6f4;
}
body{font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;position:relative}
.bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.b1{width:52vw;height:52vw;left:-14vw;top:-14vw;background:#7cc4ff}
.b2{width:44vw;height:44vw;right:-10vw;top:8vh;background:#b3c6ff}
.b3{width:40vw;height:40vw;left:22vw;bottom:-22vw;background:#c8e8ff}
.b4{width:32vw;height:32vw;right:12vw;bottom:-6vw;background:#e0eeff}
#auth-overlay{position:fixed;inset:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);background:rgba(180,200,255,.2);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:28px;padding:44px 40px 36px;width:380px;box-shadow:var(--shadow);text-align:center}
.auth-brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;opacity:.7}
.auth-title{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);margin-bottom:28px}
.auth-field{width:100%;border:1.5px solid var(--sep);border-radius:12px;padding:12px 16px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s;margin-bottom:10px;background:var(--glass-soft);color:var(--text)}
.auth-field:focus{border-color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--blue-soft)}
.auth-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;font-weight:500}
.auth-footer{font-size:11px;color:var(--faint);margin-top:20px}
.cross-nav{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:2px;height:40px;padding:0 16px;position:sticky;top:0;z-index:400;box-shadow:var(--shadow)}
.cross-nav a{font-family:'Pretendard',-apple-system,sans-serif;font-size:12px;font-weight:600;color:var(--sub);text-decoration:none;padding:5px 11px;border-radius:8px;transition:color .12s,background .12s;letter-spacing:-.01em;white-space:nowrap}
.cross-nav a:hover{color:var(--blue);background:var(--blue-soft)}
.cross-nav a.cn-active{color:var(--blue);background:var(--blue-soft)}
.cross-nav .cn-sep{width:1px;height:14px;background:var(--sep);margin:0 4px;flex-shrink:0}
.app-bar{background:rgba(10,132,255,.85);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:#fff;padding:0 36px;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15)}
.app-bar-logo{font-size:16px;font-weight:700;letter-spacing:.08em}
.app-bar-actions{display:flex;gap:8px;align-items:center}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:#fff}
.user-badge .dot{width:7px;height:7px;background:#34c759;border-radius:50%;flex-shrink:0}
.btn-logout{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:rgba(255,255,255,.9);font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(255,255,255,.18);color:#fff}
.page-wrapper{max-width:1100px;margin:28px auto;padding:0 24px 80px;position:relative;z-index:1}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.page-actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.01em;transition:all .15s}
.btn-primary{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn-primary:hover{background:var(--blue);color:#fff}
.btn-ghost{background:var(--glass);color:var(--sub);border:1.5px solid var(--stroke)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.search-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.search-input{flex:1;border:1.5px solid var(--sep);border-radius:12px;padding:9px 14px;font-family:inherit;font-size:13px;outline:none;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:border-color .15s;color:var(--text)}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.stat-sub{font-size:10px;color:var(--faint);margin-top:2px;font-weight:500}
.table-wrap{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.inv-table{width:100%;border-collapse:collapse}
.inv-table th{background:rgba(255,255,255,.2);font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid var(--sep)}
.inv-table td{padding:10px 14px;border-bottom:1px solid var(--sep);font-size:13px;font-weight:500;color:var(--text);vertical-align:middle}
.inv-table tr:last-child td{border-bottom:none}
.inv-table tr:hover td{background:rgba(255,255,255,.3)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.03em}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-green{background:rgba(48,209,88,.12);color:#1a7d3a}
.badge-yellow{background:rgba(255,204,0,.15);color:#8a6000}
.badge-red{background:rgba(255,55,95,.1);color:#c0143c}
.qty-low{color:var(--red);font-weight:700}
.table-actions{display:flex;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;transition:background .1s;color:var(--faint)}
.icon-btn:hover{background:rgba(255,255,255,.4);color:var(--text)}
.empty-row td{text-align:center;padding:40px;color:var(--faint);font-size:13px}
#item-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);z-index:5000;align-items:center;justify-content:center}
#item-modal.open{display:flex}
.modal-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:24px;padding:32px 28px;width:440px;box-shadow:var(--shadow)}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:20px;color:var(--text)}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input{width:100%;border:1.5px solid var(--sep);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:13px;font-weight:500;color:var(--text);outline:none;transition:border-color .15s;background:var(--glass-soft)}
.form-input:focus{border-color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--blue-soft)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.btn-cancel{background:var(--glass-soft);color:var(--sub);border:1.5px solid var(--sep);border-radius:20px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
</style>

<script>
const _SESSION_KEY = 'noa_session_v1';
const _SESSION_TTL = 8 * 60 * 60 * 1000;
const _AUTH_USERS_KEY = 'noa_auth_users_v1';
const _DEFAULT_USERS = [
  { username:'admin',    hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926', name:'관리자',  role:'admin' },
  { username:'david',    hash:'2d2a6626eb7a70813ec876ad277281379a2d0d6c6e33e67f3c20d5d66452ef5e', name:'김진욱',  role:'admin' },
  { username:'sooyoung', hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926', name:'소영',    role:'user'  }
];
function _loadUsers() { try { return JSON.parse(localStorage.getItem(_AUTH_USERS_KEY)) || _DEFAULT_USERS; } catch(e) { return _DEFAULT_USERS; } }
async function _sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function _getSession() { try { return JSON.parse(sessionStorage.getItem(_SESSION_KEY)); } catch(e) { return null; } }
function _setSession(user) { sessionStorage.setItem(_SESSION_KEY, JSON.stringify({ username:user.username, name:user.name, role:user.role, expires:Date.now()+_SESSION_TTL })); }
function _showUser(name) { const ov=document.getElementById('auth-overlay'); if(ov) ov.remove(); document.getElementById('user-name-display').textContent=name; init(); }
window.doLogin = async function() {
  const username=document.getElementById('auth-user').value.trim();
  const password=document.getElementById('auth-pass').value;
  if(!username||!password){document.getElementById('auth-err').textContent='아이디와 비밀번호를 입력해주세요.';return;}
  const hash=await _sha256(password);
  const user=_loadUsers().find(u=>u.username===username&&u.hash===hash);
  if(user){_setSession(user);_showUser(user.name);}
  else{document.getElementById('auth-err').textContent='아이디 또는 비밀번호가 올바르지 않습니다.';document.getElementById('auth-pass').value='';}
};
window.doLogout=function(){if(confirm('로그아웃 하시겠습니까?')){sessionStorage.removeItem(_SESSION_KEY);location.reload();}};
(function(){const s=_getSession();if(s&&Date.now()<s.expires)_showUser(s.name);})();

const _FB_CFG={apiKey:"AIzaSyBvLd4BtsmxTe2P0ZTNTBLmYTQPQGtCwYg",authDomain:"noaark-f8f75.firebaseapp.com",projectId:"noaark-f8f75",storageBucket:"noaark-f8f75.firebasestorage.app",messagingSenderId:"120494768831",appId:"1:120494768831:web:placeholder"};
if(!firebase.apps.length)firebase.initializeApp(_FB_CFG);
const db=firebase.firestore();

let items=[];
let editId=null;

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

async function save(){
  await db.collection('noa_data').doc('inventory').set({items,updatedAt:new Date().toISOString()});
}

async function init(){
  try{
    const doc=await db.collection('noa_data').doc('inventory').get();
    items=doc.exists?(doc.data().items||[]):[];
  }catch(e){items=[];}
  renderTable();
  updateStats();
  buildCatFilter();
}

function updateStats(){
  document.getElementById('s-total').textContent=items.length;
  document.getElementById('s-low').textContent=items.filter(i=>i.qty>0&&i.qty<=5).length;
  document.getElementById('s-zero').textContent=items.filter(i=>i.qty===0||!i.qty).length;
  const val=items.reduce((s,i)=>(i.qty||0)*(i.price||0)+s,0);
  document.getElementById('s-value').textContent='₩'+val.toLocaleString('ko-KR');
}

function buildCatFilter(){
  const cats=[...new Set(items.map(i=>i.cat).filter(Boolean))];
  const sel=document.getElementById('filter-cat');
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 카테고리</option>'+cats.map(c=>`<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.getElementById('filter-cat').value;
  let filtered=items.filter(i=>{
    const matchQ=!q||i.name.toLowerCase().includes(q)||(i.cat||'').toLowerCase().includes(q);
    const matchCat=!cat||i.cat===cat;
    return matchQ&&matchCat;
  });
  const tbody=document.getElementById('inv-tbody');
  if(!filtered.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="9">등록된 품목이 없습니다. 품목을 추가해보세요!</td></tr>';
    return;
  }
  const catColors=['badge-blue','badge-green','badge-yellow'];
  const catMap={};let ci=0;
  tbody.innerHTML=filtered.map(item=>{
    if(item.cat&&!catMap[item.cat])catMap[item.cat]=catColors[ci++%catColors.length];
    const badgeClass=item.cat?catMap[item.cat]:'badge-blue';
    const qty=item.qty||0;
    const qtyClass=qty===0?'qty-low':(qty<=5?'qty-low':'');
    const val=(qty*(item.price||0)).toLocaleString('ko-KR');
    const date=item.updatedAt?new Date(item.updatedAt).toLocaleDateString('ko-KR'):'';
    return `<tr>
      <td style="font-weight:700">${esc(item.name)}</td>
      <td>${item.cat?`<span class="badge ${badgeClass}">${esc(item.cat)}</span>`:'-'}</td>
      <td class="${qtyClass}">${qty.toLocaleString('ko-KR')}</td>
      <td>${esc(item.unit||'-')}</td>
      <td>${item.price?'₩'+item.price.toLocaleString('ko-KR'):'-'}</td>
      <td>${val?'₩'+val:'-'}</td>
      <td style="color:#6B7280">${esc(item.memo||'')}</td>
      <td style="color:#9CA3AF;font-size:11px">${date}</td>
      <td><div class="table-actions">
        <button class="icon-btn" onclick="editItem('${item.id}')" title="수정">✏️</button>
        <button class="icon-btn" onclick="deleteItem('${item.id}')" title="삭제">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.openModal=function(id=null){
  editId=id;
  const m=document.getElementById('item-modal');
  document.getElementById('modal-title').textContent=id?'품목 수정':'품목 추가';
  if(id){
    const item=items.find(i=>i.id===id);
    if(!item)return;
    document.getElementById('f-name').value=item.name||'';
    document.getElementById('f-cat').value=item.cat||'';
    document.getElementById('f-unit').value=item.unit||'';
    document.getElementById('f-qty').value=item.qty||0;
    document.getElementById('f-price').value=item.price||0;
    document.getElementById('f-memo').value=item.memo||'';
  } else {
    document.getElementById('f-name').value='';
    document.getElementById('f-cat').value='';
    document.getElementById('f-unit').value='';
    document.getElementById('f-qty').value=0;
    document.getElementById('f-price').value=0;
    document.getElementById('f-memo').value='';
  }
  m.classList.add('open');
  document.getElementById('f-name').focus();
};
window.closeModal=function(){document.getElementById('item-modal').classList.remove('open');};
window.editItem=function(id){openModal(id);};

window.saveItem=async function(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('품목명을 입력해주세요.');return;}
  const data={
    id:editId||genId(),
    name,
    cat:document.getElementById('f-cat').value.trim(),
    unit:document.getElementById('f-unit').value.trim(),
    qty:parseFloat(document.getElementById('f-qty').value)||0,
    price:parseFloat(document.getElementById('f-price').value)||0,
    memo:document.getElementById('f-memo').value.trim(),
    updatedAt:new Date().toISOString()
  };
  if(editId){
    const idx=items.findIndex(i=>i.id===editId);
    if(idx>=0)items[idx]=data;
  } else {
    items.push(data);
  }
  await save();
  closeModal();
  renderTable();
  updateStats();
  buildCatFilter();
};

window.deleteItem=async function(id){
  if(!confirm('이 품목을 삭제하시겠습니까?'))return;
  items=items.filter(i=>i.id!==id);
  await save();
  renderTable();
  updateStats();
  buildCatFilter();
};

window.exportCSV=function(){
  const header='품목명,카테고리,수량,단위,단가,재고금액,비고';
  const rows=items.map(i=>[i.name,i.cat||'',i.qty||0,i.unit||'',i.price||0,(i.qty||0)*(i.price||0),i.memo||''].join(','));
  const blob=new Blob(['﻿'+header+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='재고관리_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};

document.getElementById('item-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
