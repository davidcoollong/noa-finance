<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOA 자금관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0a84ff;--blue-soft:rgba(10,132,255,.12);
  --red:#ff375f;--green:#30d158;
  --text:#1c1c1e;--sub:#6e6e73;--faint:#a1a1a6;
  --sep:rgba(60,60,67,.12);
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.78);--glass-soft:rgba(255,255,255,.32);
  --stroke:rgba(255,255,255,.75);
  --shadow:0 10px 40px rgba(40,60,120,.14),0 1px 2px rgba(40,60,120,.08);
  --blur:blur(28px) saturate(180%);
  --radius:16px;--bg:#dde6f4;
}
body{font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;position:relative}
.bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.b1{width:52vw;height:52vw;left:-14vw;top:-14vw;background:#7cc4ff}
.b2{width:44vw;height:44vw;right:-10vw;top:8vh;background:#b3c6ff}
.b3{width:40vw;height:40vw;left:22vw;bottom:-22vw;background:#c8e8ff}
.b4{width:32vw;height:32vw;right:12vw;bottom:-6vw;background:#e0eeff}

/* ── Auth overlay ── */
#auth-overlay{position:fixed;inset:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);background:rgba(180,200,255,.2);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:28px;padding:44px 40px 36px;width:380px;box-shadow:var(--shadow);text-align:center}
.auth-brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;opacity:.7}
.auth-title{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);margin-bottom:28px}
.auth-field{width:100%;border:1.5px solid var(--sep);border-radius:12px;padding:12px 16px;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);outline:none;transition:border-color .15s;margin-bottom:10px;background:var(--glass-soft)}
.auth-field:focus{border-color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--blue-soft)}
.auth-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;font-weight:500}
.auth-footer{font-size:11px;color:var(--faint);margin-top:20px}

/* ── Cross nav ── */
.cross-nav{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:2px;height:40px;padding:0 16px;position:sticky;top:0;z-index:400;box-shadow:var(--shadow)}
.cross-nav a{font-family:'Pretendard',-apple-system,sans-serif;font-size:12px;font-weight:600;color:var(--sub);text-decoration:none;padding:5px 11px;border-radius:8px;transition:color .12s,background .12s;letter-spacing:-.01em;white-space:nowrap}
.cross-nav a:hover{color:var(--blue);background:var(--blue-soft)}
.cross-nav a.cn-active{color:var(--blue);background:var(--blue-soft)}
.cross-nav .cn-sep{width:1px;height:14px;background:var(--sep);margin:0 4px;flex-shrink:0}

/* ── App bar ── */
.app-bar{background:rgba(10,132,255,.85);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15)}
.app-bar-logo{font-size:15px;font-weight:700;letter-spacing:.06em}
.app-bar-actions{display:flex;gap:8px;align-items:center}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:#fff}
.user-badge .dot{width:7px;height:7px;background:#34c759;border-radius:50%;flex-shrink:0}
.btn-logout{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:rgba(255,255,255,.9);font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(255,255,255,.18);color:#fff}
.nav-logo-img{height:30px;width:auto;object-fit:contain;flex-shrink:0}

/* ── Page layout ── */
.page-wrapper{max-width:1400px;margin:0 auto;padding:20px 24px 80px;position:relative;z-index:1}
.board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.board-nav{display:flex;align-items:center;gap:8px}
.board-nav button{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1.5px solid var(--stroke);border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);transition:all .12s;box-shadow:var(--shadow)}
.board-nav button:hover{border-color:var(--blue);color:var(--blue)}
.board-nav span{font-size:15px;font-weight:800;color:var(--text);min-width:80px;text-align:center;letter-spacing:-.02em}
.board-actions{display:flex;gap:8px}
.btn-primary{background:transparent;color:var(--blue);border:1.5px solid var(--blue);border-radius:20px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:-.01em;transition:all .15s;backdrop-filter:var(--blur)}
.btn-primary:hover{background:var(--blue);color:#fff}
.btn-ghost{background:var(--glass);color:var(--sub);border:1.5px solid var(--stroke);border-radius:20px;padding:7px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:-.01em;transition:all .15s;backdrop-filter:var(--blur)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

/* ── Stat cards ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{flex:1;min-width:160px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.stat-value.blue{color:var(--blue)}
.stat-value.red{color:var(--red)}
.stat-pill{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:8px}
.stat-pill.neg{background:rgba(255,55,95,.1);color:var(--red)}
.stat-sub{font-size:10px;color:var(--faint);margin-top:2px;font-weight:500}

/* ── Week board grid ── */
.week-grid{display:grid;gap:10px;align-items:start;margin-top:4px}
.week-col{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:400px}
.week-col-header{padding:14px 16px 12px;border-bottom:1px solid var(--sep)}
.week-num{font-size:20px;font-weight:800;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px;line-height:1}
.week-dates{font-size:18px;font-weight:600;color:var(--text);margin-bottom:12px;letter-spacing:-.02em}

/* ── Week mini stats ── */
.week-mini-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.week-stat{background:var(--glass-soft);border:1px solid var(--sep);border-radius:10px;padding:7px 8px;min-height:52px;display:flex;flex-direction:column;justify-content:space-between}
.week-stat-label{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;line-height:1}
.week-stat-val{font-size:13px;font-weight:800;letter-spacing:-0.3px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.week-stat-val.income{color:var(--blue)}
.week-stat-val.expense{color:var(--text)}
.week-stat-sign{font-size:10px;font-weight:700;margin-right:1px;vertical-align:middle}

/* ── Carry row ── */
.week-carry-row{display:flex;align-items:stretch;gap:0;margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--sep)}
.carry-item{flex:1;text-align:center;padding:6px 4px;background:rgba(255,255,255,.2)}
.carry-item.cum{background:rgba(10,132,255,.1)}
.carry-item.cum.neg{background:rgba(255,55,95,.08)}
.carry-label{display:block;font-size:7.5px;font-weight:800;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.carry-val{font-size:11px;font-weight:900;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.carry-val.pos{color:var(--blue)}
.carry-val.neg{color:var(--red)}
.carry-val.zero{color:var(--faint)}
.carry-divider{width:1px;background:var(--sep);flex-shrink:0}

/* ── Status bar ── */
.week-status-bar{margin:6px 12px 0;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:8px}
.week-status-bar.deficit{background:rgba(255,55,95,.07);border:1.5px solid rgba(255,55,95,.22)}
.week-status-bar.surplus{background:rgba(10,132,255,.07);border:1.5px solid rgba(10,132,255,.18)}
.week-status-bar.zero{background:rgba(255,255,255,.2);border:1.5px solid var(--sep)}
.wsb-icon{font-size:15px;flex-shrink:0;line-height:1.2}
.wsb-body{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.wsb-title{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.wsb-title.deficit{color:var(--red)}
.wsb-title.surplus{color:var(--blue)}
.wsb-title.zero{color:var(--sub)}
.wsb-amount{font-size:14px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1;text-align:right;margin-left:auto}
.wsb-amount.deficit{color:var(--red)}
.wsb-amount.surplus{color:var(--blue)}
.wsb-amount.zero{color:var(--sub)}

/* ── Transaction list ── */
.week-tx-list{flex:1;overflow-y:auto}
.tx-empty{padding:24px 16px;text-align:center;color:var(--faint);font-size:12px}
.tx-item{display:grid;grid-template-columns:68px 1fr auto;align-items:center;padding:6px 16px;gap:8px;transition:background .12s}
.tx-item:hover{background:rgba(255,255,255,.3)}
.tx-left{display:contents}
.tx-date-tag{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.tx-edit-name{font-size:12px;font-weight:600;color:var(--text);border:none;background:transparent;width:100%;font-family:inherit;padding:0;cursor:text;letter-spacing:-.02em;min-width:0}
.tx-edit-name:hover{background:rgba(255,255,255,.5);border-radius:4px;padding:1px 4px}
.tx-edit-name:focus{outline:none;background:rgba(255,255,255,.9);border-radius:4px;padding:1px 4px;box-shadow:0 0 0 1.5px var(--blue)}
.tx-edit-amount{font-size:12px;font-weight:800;letter-spacing:-0.3px;border:none;background:transparent;text-align:right;font-family:inherit;cursor:text;width:90px;font-variant-numeric:tabular-nums;color:inherit}
.tx-edit-amount:hover{background:rgba(255,255,255,.5);border-radius:3px;padding:1px 3px}
.tx-edit-amount:focus{outline:none;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 3px;box-shadow:0 0 0 1.5px var(--blue)}
.tx-del{background:none;border:none;color:var(--sep);cursor:pointer;font-size:16px;transition:color .12s;padding:0 2px;line-height:1}
.tx-del:hover{color:var(--red)}

/* ── Week add button ── */
.week-add-btn{width:100%;padding:10px;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;border-top:1px dashed var(--sep);transition:background .12s;letter-spacing:-.01em}
.week-add-btn:hover{background:var(--blue-soft)}

/* ── Fixed expenses section ── */
.fixed-section{border-top:1px solid var(--sep);background:rgba(255,149,0,.04)}
.fixed-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px}
.fixed-header-label{font-size:12px;font-weight:800;color:#ff9f0a;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.fixed-dot{width:6px;height:6px;border-radius:50%;background:#ff9f0a;flex-shrink:0}
.fixed-list{padding-bottom:4px}
.fixed-item{display:flex;align-items:center;justify-content:space-between;padding:5px 16px;gap:6px}
.fixed-item:hover{background:rgba(255,149,0,.06)}
.fixed-day{font-size:10px;font-weight:700;color:#ff9f0a;width:24px;flex-shrink:0}
.fixed-name-edit{font-size:11px;font-weight:600;color:var(--text);border:none;background:transparent;flex:1;font-family:inherit;cursor:text;min-width:0}
.fixed-name-edit:focus{outline:none;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 3px;box-shadow:0 0 0 1.5px #ff9f0a}
.fixed-amount-edit{font-size:11px;font-weight:800;color:#ff9f0a;border:none;background:transparent;text-align:right;font-family:inherit;width:80px;cursor:text;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.fixed-amount-edit:hover{background:rgba(255,255,255,.5);border-radius:3px;padding:1px 3px}
.fixed-amount-edit:focus{outline:none;background:rgba(255,255,255,.9);border-radius:3px;padding:1px 3px;box-shadow:0 0 0 1.5px #ff9f0a}
.fixed-empty{padding:8px 16px;font-size:11px;color:var(--faint)}
.fixed-del{background:none;border:none;color:var(--sep);cursor:pointer;font-size:14px;transition:color .12s}
.fixed-del:hover{color:var(--red)}
.fixed-add-btn{width:100%;padding:7px;border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:#ff9f0a;cursor:pointer;border-top:1px solid rgba(255,149,0,.18);transition:background .12s}
.fixed-add-btn:hover{background:rgba(255,149,0,.06)}
.gcal-btn{background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.3);color:#ff9f0a;font-family:inherit;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer}

/* ── Add modal ── */
#add-modal,#fixed-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);z-index:5000;align-items:center;justify-content:center}
#add-modal.open,#fixed-modal.open{display:flex}
.modal-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:24px;padding:28px;width:420px;max-width:95vw;box-shadow:var(--shadow)}
.modal-title{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-bottom:18px;color:var(--text)}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input{width:100%;border:1.5px solid var(--sep);border-radius:12px;padding:10px 13px;font-family:inherit;font-size:13px;outline:none;background:var(--glass-soft);transition:border-color .15s;color:var(--text)}
.form-input:focus{border-color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--blue-soft)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.modal-footer{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.type-toggle{display:flex;border:1.5px solid var(--sep);border-radius:12px;overflow:hidden;margin-bottom:12px}
.type-btn{flex:1;padding:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .15s;color:var(--faint)}
.type-btn.active.income{background:var(--blue);color:#fff}
.type-btn.active.expense{background:var(--red);color:#fff}

/* ── Fixed expense modal ── */
.fixed-modal-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:24px;padding:28px;width:520px;max-width:95vw;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow)}
.fixed-modal-title{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-bottom:16px;color:var(--text)}
.fixed-modal-table{width:100%;border-collapse:collapse;margin-bottom:12px}
.fixed-modal-table th{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--sep);text-align:left}
.fixed-modal-table td{padding:6px 8px;border-bottom:1px solid var(--sep);font-size:12px;vertical-align:middle}
.fixed-modal-table tr:last-child td{border-bottom:none}
.ta-r{text-align:right}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

function getMondayOf(dt){const d=new Date(dt);const day=d.getDay();const diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d;}
function getMonthEntries(y,m){const p=y+'-'+String(m).padStart(2,'0');return DB.entries.filter(e=>e.date&&e.date.startsWith(p));}
function getIncome(arr){return arr.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);}

async function init(){
  try{
    const doc=await db.collection('noa_data').doc('finance').get();
    if(doc.exists){
      const data=doc.data();
      // Load entries — support both 'entries' and legacy 'transactions'
      if(Array.isArray(data.entries)&&data.entries.length>0){
        DB.entries=data.entries;
      } else if(Array.isArray(data.transactions)&&data.transactions.length>0){
        DB.entries=data.transactions.map(t=>({id:t.id,type:t.type,date:t.date,memo:t.memo||t.cat||'',amount:t.amount||0}));
      } else {
        await loadSeed();
      }
      // Load fixed expenses from Firestore if present, else use localStorage seed
      if(Array.isArray(data.fixed)&&data.fixed.length>0){
        FX=data.fixed;
        localStorage.setItem(FIXED_KEY,JSON.stringify(FX));
      } else {
        FX=loadFixed();
      }
    } else {
      FX=loadFixed();
      await loadSeed();
    }
  }catch(e){
    console.error(e);
    DB.entries=[];
    FX=loadFixed();
  }
  // Jump to most recent month that has data
  if(DB.entries.length>0){
    const dates=DB.entries.map(e=>e.date).filter(Boolean).sort();
    const lastDate=dates[dates.length-1];
    const [ly,lm]=lastDate.split('-').map(Number);
    boardYear=ly; boardMonth=lm;
  }
  renderBoard();
}

async function loadSeed(){
  if(localStorage.getItem(SEED_KEY))return;
  DB.entries=[];
  SEED.forEach(s=>{
    if(s.income>0)DB.entries.push({id:uid(),type:'income',date:s.date,memo:s.item,amount:s.income});
    if(s.expense>0)DB.entries.push({id:uid(),type:'expense',date:s.date,memo:s.item,amount:s.expense});
  });
  localStorage.setItem(SEED_KEY,'1');
  await saveDB();
}

// ─────────────────── Board render ───────────────────
function renderBoard(){
  const y=boardYear,m=boardMonth;
  document.getElementById('board-title').textContent=y+'년 '+m+'월';

  const mEntries=getMonthEntries(y,m);
  const totalIncome=getIncome(mEntries);
  const totalVarExpense=getExpense(mEntries);
  const totalFixedExpense=FX.reduce((s,f)=>s+f.amount,0);
  const totalExpense=totalVarExpense+totalFixedExpense;
  const balance=totalIncome-totalExpense;

  const monthStartStr=y+'-'+String(m).padStart(2,'0')+'-01';
  const carryIntoMonth=DB.entries
    .filter(e=>e.date<monthStartStr)
    .reduce((s,e)=>s+(e.type==='income'?e.amount:-e.amount),0);
  const cumMonth=carryIntoMonth+balance;

  // Update stat cards
  const carryEl=document.getElementById('s-carryover');
  carryEl.textContent=(carryIntoMonth>=0?'+':'')+Math.round(carryIntoMonth).toLocaleString('ko-KR');
  carryEl.style.color=carryIntoMonth>=0?'var(--blue)':'var(--red)';
  document.getElementById('s-income').textContent=won(totalIncome);
  document.getElementById('s-income-cnt').textContent=mEntries.filter(e=>e.type==='income').length+'건';
  document.getElementById('s-expense').textContent=won(totalExpense);
  document.getElementById('s-expense-cnt').textContent=(mEntries.filter(e=>e.type==='expense').length+FX.length)+'건';
  const cumEl=document.getElementById('s-cumend');
  cumEl.textContent=(cumMonth>=0?'+':'')+Math.round(cumMonth).toLocaleString('ko-KR');
  cumEl.style.color=cumMonth>=0?'var(--blue)':'var(--red)';

  // Build weeks
  const firstDay=new Date(y,m-1,1);
  const lastDay=new Date(y,m,0);
  const weeks=[];
  let cur=getMondayOf(firstDay);
  while(cur<=lastDay){
    const ws=new Date(cur);
    const we=new Date(cur);
    we.setDate(we.getDate()+6);
    const ds=new Date(Math.max(ws,firstDay));
    const de=new Date(Math.min(we,lastDay));
    weeks.push({start:dateStr(ws),end:dateStr(we),dispStart:dateStr(ds),dispEnd:dateStr(de)});
    cur.setDate(cur.getDate()+7);
  }

  const grid=document.getElementById('week-grid');
  grid.style.gridTemplateColumns=`repeat(${weeks.length},minmax(220px,1fr))`;

  const DAY=['일','월','화','수','목','금','토'];
  let runningBalance=carryIntoMonth;

  const weekMeta=weeks.map(w=>{
    const wEntries=mEntries.filter(e=>e.date>=w.start&&e.date<=w.end);
    const wIncome=getIncome(wEntries);
    const wExpense=getExpense(wEntries);
    const dispStart=new Date(w.dispStart+'T00:00:00');
    const dispEnd=new Date(w.dispEnd+'T00:00:00');
    const wFixedExpense=FX.filter(f=>f.dayOfMonth>=dispStart.getDate()&&f.dayOfMonth<=dispEnd.getDate()).reduce((s,f)=>s+f.amount,0);
    const wNet=wIncome-wExpense-wFixedExpense;
    const carryIn=runningBalance;
    const cumEnd=runningBalance+wNet;
    runningBalance=cumEnd;
    return{wEntries,wIncome,wExpense,wFixedExpense,wNet,carryIn,cumEnd};
  });

  grid.innerHTML=weeks.map((w,wi)=>{
    const{wEntries,wIncome,wExpense,wNet,carryIn,cumEnd}=weekMeta[wi];
    const startDt=new Date(w.dispStart+'T00:00:00');
    const endDt=new Date(w.dispEnd+'T00:00:00');
    const sameDay=w.dispStart===w.dispEnd;
    const dateRange=sameDay
      ?`${startDt.getMonth()+1}/${startDt.getDate()}(${DAY[startDt.getDay()]})`
      :`${startDt.getMonth()+1}/${startDt.getDate()}(${DAY[startDt.getDay()]}) ~ ${endDt.getMonth()+1}/${endDt.getDate()}(${DAY[endDt.getDay()]})`;

    const txHtml=wEntries.length===0
      ?`<div class="tx-empty">거래 없음</div>`
      :wEntries.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`
        <div class="tx-item">
          <div class="tx-date-tag">${fmtFull(e.date)}</div>
          <input class="tx-edit-name" value="${(e.memo||'').replace(/"/g,'&quot;')}" title="클릭하여 편집"
            onblur="updateEntry('${e.id}','memo',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <div style="display:flex;align-items:center;gap:4px">
            <input class="tx-edit-amount" value="${e.amount.toLocaleString('ko-KR')}" type="text"
              style="color:${e.type==='income'?'var(--blue)':'#FF9999'}"
              onblur="updateEntry('${e.id}','amount',this.value)"
              onkeydown="if(event.key==='Enter')this.blur()">
            <button class="tx-del" onclick="deleteEntry('${e.id}')" title="삭제">×</button>
          </div>
        </div>`).join('');

    // Carry row
    const carrySign=carryIn>=0?'+':'-';
    const carryClass=carryIn>0?'pos':carryIn<0?'neg':'zero';
    const cumSign=cumEnd>=0?'+':'-';
    const cumClass=cumEnd>0?'pos':cumEnd<0?'neg':'zero';
    const cumItemClass='cum'+(cumEnd<0?' neg':'');
    const carryRow=`
      <div class="week-carry-row">
        <div class="carry-item">
          <span class="carry-label">이월잔액</span>
          <span class="carry-val ${carryClass}">${carrySign}${Math.round(Math.abs(carryIn)).toLocaleString('ko-KR')}</span>
        </div>
        <div class="carry-divider"></div>
        <div class="carry-item">
          <span class="carry-label">주간손익</span>
          <span class="carry-val ${wNet>=0?'pos':'neg'}">${wNet>=0?'+':'-'}${Math.round(Math.abs(wNet)).toLocaleString('ko-KR')}</span>
        </div>
        <div class="carry-divider"></div>
        <div class="carry-item ${cumItemClass}">
          <span class="carry-label">📊 누적잔액</span>
          <span class="carry-val ${cumClass}">${cumSign}${Math.round(Math.abs(cumEnd)).toLocaleString('ko-KR')}</span>
        </div>
      </div>`;

    // Status bar
    let statusBar='';
    if(cumEnd<0){
      const need=Math.abs(cumEnd);
      statusBar=`
        <div class="week-status-bar deficit">
          <div class="wsb-icon">🔴</div>
          <div class="wsb-body">
            <div class="wsb-title deficit">자금 부족</div>
            <div class="wsb-amount deficit">₩${need.toLocaleString('ko-KR')} 필요</div>
          </div>
        </div>`;
    }else if(cumEnd>0){
      statusBar=`
        <div class="week-status-bar surplus">
          <div class="wsb-icon">🟢</div>
          <div class="wsb-body">
            <div class="wsb-title surplus">자금 여유</div>
            <div class="wsb-amount surplus">+₩${cumEnd.toLocaleString('ko-KR')}</div>
          </div>
        </div>`;
    }else{
      statusBar=`
        <div class="week-status-bar zero">
          <div class="wsb-icon">⚪</div>
          <div class="wsb-body">
            <div class="wsb-title zero">자금 균형</div>
            <div class="wsb-amount zero">₩0</div>
          </div>
        </div>`;
    }

    const defaultDate=dateStr(startDt)>=today?dateStr(startDt):today;

    return`<div class="week-col">
      <div class="week-col-header">
        <div class="week-num">${wi+1}주차</div>
        <div class="week-dates">${dateRange}</div>
        <div class="week-mini-stats">
          <div class="week-stat">
            <div class="week-stat-label">수입</div>
            <div class="week-stat-val income">${wIncome>0?won(wIncome):'—'}</div>
          </div>
          <div class="week-stat">
            <div class="week-stat-label">지출</div>
            <div class="week-stat-val expense">${wExpense>0?won(wExpense):'—'}</div>
          </div>
        </div>
        ${carryRow}
      </div>
      ${statusBar}
      <div class="week-tx-list">${txHtml}</div>
      <button class="week-add-btn" onclick="openAddModal('income','${defaultDate}')">+ 항목 추가</button>
      ${renderWeekFixed(startDt.getDate(),endDt.getDate())}
    </div>`;
  }).join('');
}

// ─────────────────── Fixed expense rendering ───────────────────
function renderWeekFixed(startDay,endDay){
  const items=FX.filter(f=>f.dayOfMonth>=startDay&&f.dayOfMonth<=endDay);
  const total=items.reduce((s,f)=>s+f.amount,0);
  if(items.length===0)return`
    <div class="fixed-section">
      <div class="fixed-header">
        <div class="fixed-header-label"><span class="fixed-dot"></span>고정비</div>
        <button class="gcal-btn" onclick="openFixedModal()">관리</button>
      </div>
      <div class="fixed-empty">해당 주 고정비 없음</div>
    </div>`;
  return`
    <div class="fixed-section">
      <div class="fixed-header">
        <div class="fixed-header-label"><span class="fixed-dot"></span>고정비 ${items.length}건</div>
        <span style="font-size:14px;font-weight:800;color:#FF9999">${won(total)}</span>
      </div>
      <div class="fixed-list">
        ${items.map(f=>`
        <div class="fixed-item">
          <span class="fixed-day">${f.dayOfMonth}일</span>
          <input class="fixed-name-edit" value="${(f.memo||'').replace(/"/g,'&quot;')}"
            onblur="updateFixed('${f.id}','memo',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <input class="fixed-amount-edit" value="${f.amount.toLocaleString('ko-KR')}" type="text"
            onblur="updateFixed('${f.id}','amount',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <button class="fixed-del" onclick="deleteFixed('${f.id}')" title="삭제">×</button>
        </div>`).join('')}
      </div>
      <button class="fixed-add-btn" onclick="openFixedModal()">+ 고정비 추가/관리</button>
    </div>`;
}

// ─────────────────── Entry CRUD ───────────────────
window.updateEntry=async function(id,field,value){
  const e=DB.entries.find(x=>x.id===id);if(!e)return;
  if(field==='amount'){const v=parseFloat(value.replace(/,/g,''));if(!isNaN(v)&&v>0)e.amount=v;}
  else if(field==='memo'){e.memo=value.trim();}
  await saveDB();renderBoard();
};

window.deleteEntry=async function(id){
  if(!confirm('삭제하시겠습니까?'))return;
  DB.entries=DB.entries.filter(x=>x.id!==id);
  await saveDB();renderBoard();
};

window.updateFixed=function(id,field,value){
  const f=FX.find(x=>x.id===id);if(!f)return;
  if(field==='amount'){const v=parseFloat(value.replace(/,/g,''));if(!isNaN(v)&&v>0)f.amount=v;}
  else if(field==='memo'){f.memo=value.trim();}
  else if(field==='dayOfMonth'){const v=parseInt(value);if(!isNaN(v)&&v>=1&&v<=31){f.dayOfMonth=v;FX.sort((a,b)=>a.dayOfMonth-b.dayOfMonth);}}
  saveFixed();renderBoard();
};

window.deleteFixed=function(id){
  if(!confirm('고정비를 삭제하시겠습니까?'))return;
  FX=FX.filter(x=>x.id!==id);
  saveFixed();renderBoard();
};

// ─────────────────── Month nav ───────────────────
window.changeMonth=function(d){
  boardMonth+=d;
  if(boardMonth>12){boardMonth=1;boardYear++;}
  if(boardMonth<1){boardMonth=12;boardYear--;}
  renderBoard();
};

// ─────────────────── Add modal ───────────────────
window.setModalType=function(t){
  modalType=t;
  document.getElementById('type-btn-income').className='type-btn'+(t==='income'?' active income':'');
  document.getElementById('type-btn-expense').className='type-btn'+(t==='expense'?' active expense':'');
};

window.openAddModal=function(type='income',defaultDate=null){
  editEntryId=null;
  document.getElementById('add-modal-title').textContent='항목 추가';
  setModalType(type);
  document.getElementById('f-date').value=defaultDate||today;
  document.getElementById('f-amount').value='';
  document.getElementById('f-memo').value='';
  document.getElementById('add-modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-amount').focus(),100);
};

window.closeAddModal=function(){document.getElementById('add-modal').classList.remove('open');};

window.saveEntry=async function(){
  const date=document.getElementById('f-date').value;
  const amount=parseFloat(document.getElementById('f-amount').value)||0;
  if(!date||!amount){alert('날짜와 금액을 입력해주세요.');return;}
  const entry={id:editEntryId||uid(),type:modalType,date,amount,memo:document.getElementById('f-memo').value.trim()};
  if(editEntryId){const i=DB.entries.findIndex(x=>x.id===editEntryId);if(i>=0)DB.entries[i]=entry;}
  else DB.entries.push(entry);
  await saveDB();
  closeAddModal();
  renderBoard();
};

document.getElementById('add-modal').addEventListener('click',function(e){if(e.target===this)closeAddModal();});

// ─────────────────── Fixed modal ───────────────────
window.openFixedModal=function(){
  renderFixedModal();
  document.getElementById('fixed-modal').classList.add('open');
};
window.closeFixedModal=function(){document.getElementById('fixed-modal').classList.remove('open');};

function renderFixedModal(){
  const tbody=document.getElementById('fixed-modal-tbody');
  tbody.innerHTML=FX.map(f=>`
    <tr>
      <td><input style="width:40px;border:1px solid #E5E7EB;border-radius:6px;padding:3px 5px;font-family:inherit;font-size:12px;text-align:center" value="${f.dayOfMonth}"
        onblur="updateFixed('${f.id}','dayOfMonth',this.value)" type="number" min="1" max="31"></td>
      <td><input style="width:100%;border:1px solid #E5E7EB;border-radius:6px;padding:3px 6px;font-family:inherit;font-size:12px" value="${(f.memo||'').replace(/"/g,'&quot;')}"
        onblur="updateFixed('${f.id}','memo',this.value)"></td>
      <td class="ta-r"><input style="width:90px;border:1px solid #E5E7EB;border-radius:6px;padding:3px 6px;font-family:inherit;font-size:12px;text-align:right;font-weight:700" value="${f.amount.toLocaleString('ko-KR')}"
        onblur="updateFixed('${f.id}','amount',this.value)"></td>
      <td><button onclick="deleteFixed('${f.id}');renderFixedModal()" style="background:none;border:none;color:#9CA3AF;cursor:pointer;font-size:16px">×</button></td>
    </tr>`).join('');
  const total=FX.reduce((s,f)=>s+f.amount,0);
  document.getElementById('fixed-modal-total').textContent='₩'+total.toLocaleString('ko-KR');
}

window.addFixedItem=function(){
  const id='f'+Date.now().toString(36);
  FX.push({id,dayOfMonth:1,memo:'새 고정비',amount:0,category:'법인'});
  saveFixed();renderFixedModal();
};

document.getElementById('fixed-modal').addEventListener('click',function(e){if(e.target===this)closeFixedModal();});
</script>
</body>
