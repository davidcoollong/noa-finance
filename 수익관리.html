<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOA 수익관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0a84ff;--blue-soft:rgba(10,132,255,.12);--red:#ff375f;--green:#30d158;
  --text:#1c1c1e;--sub:#6e6e73;--faint:#a1a1a6;--sep:rgba(60,60,67,.12);
  --glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.78);--glass-soft:rgba(255,255,255,.32);
  --stroke:rgba(255,255,255,.75);--shadow:0 10px 40px rgba(40,60,120,.14),0 1px 2px rgba(40,60,120,.08);
  --blur:blur(28px) saturate(180%);--radius:16px;--bg:#dde6f4;
}
body{font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;position:relative}
.bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.b1{width:52vw;height:52vw;left:-14vw;top:-14vw;background:#7cc4ff}
.b2{width:44vw;height:44vw;right:-10vw;top:8vh;background:#b3c6ff}
.b3{width:40vw;height:40vw;left:22vw;bottom:-22vw;background:#c8e8ff}
.b4{width:32vw;height:32vw;right:12vw;bottom:-6vw;background:#e0eeff}

#auth-overlay{position:fixed;inset:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);background:rgba(180,200,255,.2);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:28px;padding:44px 40px 36px;width:380px;box-shadow:var(--shadow);text-align:center}
.auth-brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:8px;opacity:.7}
.auth-title{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);margin-bottom:28px}
.auth-field{width:100%;border:1.5px solid var(--sep);border-radius:12px;padding:12px 16px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s;margin-bottom:10px;background:var(--glass-soft);color:var(--text)}
.auth-field:focus{border-color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--blue-soft)}
.auth-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;font-weight:500}

.cross-nav{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:2px;height:40px;padding:0 16px;position:sticky;top:0;z-index:400;box-shadow:var(--shadow)}
.cross-nav a{font-size:12px;font-weight:600;color:var(--sub);text-decoration:none;padding:5px 11px;border-radius:8px;transition:color .12s,background .12s;white-space:nowrap}
.cross-nav a:hover{color:var(--blue);background:var(--blue-soft)}
.cross-nav a.cn-active{color:var(--blue);background:var(--blue-soft)}
.cross-nav .cn-sep{width:1px;height:14px;background:var(--sep);margin:0 4px}

.app-bar{background:rgba(10,132,255,.85);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15)}
.app-bar-logo{font-size:15px;font-weight:700;letter-spacing:.06em}
.app-bar-actions{display:flex;gap:8px;align-items:center}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.user-badge .dot{width:7px;height:7px;background:#34c759;border-radius:50%}
.btn-logout{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:rgba(255,255,255,.9);font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(255,255,255,.18);color:#fff}

.layout{display:flex;height:calc(100vh - 92px);overflow:hidden;position:relative;z-index:1}
.sidebar{width:260px;flex-shrink:0;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--sep);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-size:13px;font-weight:800;color:var(--text)}
.btn-add-proj{background:transparent;color:var(--blue);border:1.5px solid var(--blue);border-radius:20px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-add-proj:hover{background:var(--blue);color:#fff}
.proj-list{flex:1;overflow-y:auto;padding:8px}
.proj-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .1s;margin-bottom:2px}
.proj-item:hover{background:rgba(255,255,255,.4)}
.proj-item.active{background:var(--blue-soft);border:1.5px solid rgba(10,132,255,.2)}
.proj-item-dot{width:8px;height:8px;border-radius:50%;background:var(--sep);flex-shrink:0}
.proj-item.active .proj-item-dot{background:var(--blue)}
.proj-item-name{font-size:12px;font-weight:600;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-item.active .proj-item-name{color:var(--blue)}
.proj-del-btn{background:none;border:none;color:var(--sep);cursor:pointer;font-size:14px;padding:1px 4px;opacity:0;transition:opacity .1s,color .1s;flex-shrink:0}
.proj-item:hover .proj-del-btn{opacity:1}
.proj-del-btn:hover{color:var(--red);opacity:1}
.proj-qty-badge{font-size:10px;color:var(--faint);font-weight:500;flex-shrink:0}

.main{flex:1;overflow-y:auto;padding:24px;background:transparent}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--faint)}
.empty-icon{font-size:48px}
.empty-text{font-size:14px;font-weight:600}

.proj-header{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.proj-name-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.proj-name-input{font-size:20px;font-weight:800;letter-spacing:-.5px;border:none;background:transparent;font-family:inherit;color:var(--text);flex:1;min-width:200px}
.proj-name-input:focus{outline:none;border-bottom:2px solid var(--blue)}
.qty-input-wrap{display:flex;align-items:center;gap:6px}
.qty-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;white-space:nowrap}
.qty-input{width:90px;border:1.5px solid var(--sep);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:13px;font-weight:700;text-align:right;outline:none;background:var(--glass-soft)}
.qty-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.btn-copy-proj{background:var(--glass-soft);border:1.5px solid var(--sep);border-radius:20px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .12s}
.btn-copy-proj:hover{border-color:var(--blue);color:var(--blue)}

.supply-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.supply-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-right:4px}
.supply-item{display:flex;align-items:center;gap:6px;background:var(--glass-soft);border:1px solid var(--sep);border-radius:10px;padding:6px 10px}
.supply-name{font-size:11px;font-weight:600;color:var(--sub)}
.supply-input{width:52px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:800;text-align:center;color:var(--blue);outline:none}
.supply-pct{font-size:11px;font-weight:700;color:var(--blue)}
.btn-add-rate{background:none;border:1.5px dashed var(--sep);border-radius:10px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--faint);cursor:pointer;transition:all .12s}
.btn-add-rate:hover{border-color:var(--blue);color:var(--blue)}

.msrp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.msrp-item{display:flex;align-items:center;gap:6px;background:var(--blue-soft);border:1px solid rgba(10,132,255,.2);border-radius:10px;padding:6px 10px}
.msrp-label-input{font-size:11px;font-weight:700;color:var(--sub);border:none;background:transparent;font-family:inherit;width:60px;outline:none}
.msrp-price-input{width:90px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:800;text-align:right;color:var(--blue);outline:none}
.msrp-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:0 2px}
.msrp-del:hover{color:var(--red)}
.btn-add-msrp{background:none;border:1.5px dashed rgba(10,132,255,.3);border-radius:10px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;transition:all .12s;opacity:.7}
.btn-add-msrp:hover{opacity:1}

.section-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title-count{background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.cost-group{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.group-header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.2);border-bottom:1px solid var(--sep);cursor:pointer}
.group-header:hover{background:rgba(255,255,255,.35)}
.group-toggle{font-size:11px;color:var(--faint);width:14px}
.group-name-input{font-size:13px;font-weight:700;color:var(--text);border:none;background:transparent;font-family:inherit;flex:1;outline:none;cursor:text}
.group-name-input:focus{background:rgba(255,255,255,.9);border-radius:4px;padding:1px 5px;box-shadow:0 0 0 1.5px var(--blue)}
.group-qty-input{width:70px;border:1.5px solid var(--sep);border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12px;font-weight:700;text-align:right;outline:none;background:var(--glass-soft)}
.group-qty-input:focus{border-color:var(--blue)}
.group-total{font-size:12px;font-weight:800;color:var(--text);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.group-del-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;transition:color .1s;padding:0 3px;flex-shrink:0}
.group-del-btn:hover{color:var(--red)}

.items-table{width:100%;border-collapse:collapse}
.items-table th{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;padding:7px 16px;text-align:left;border-bottom:1px solid var(--sep)}
.items-table th.r{text-align:right}
.items-table td{padding:6px 16px;border-bottom:1px solid var(--sep);vertical-align:middle}
.items-table tr:last-child td{border-bottom:none}
.item-name-input{font-size:12px;font-weight:500;color:var(--text);border:none;background:transparent;font-family:inherit;width:100%;outline:none;cursor:text}
.item-name-input:focus{background:rgba(255,255,255,.9);border-radius:4px;padding:1px 5px;box-shadow:0 0 0 1.5px var(--blue)}
.item-num-input{font-size:12px;font-weight:700;color:var(--text);border:1.5px solid var(--sep);border-radius:8px;padding:4px 8px;font-family:inherit;width:90px;text-align:right;outline:none;font-variant-numeric:tabular-nums;background:var(--glass-soft)}
.item-num-input:focus{border-color:var(--blue)}
.item-total{font-size:12px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums;min-width:100px}
.item-del-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;padding:0 3px}
.item-del-btn:hover{color:var(--red)}
.add-item-row{padding:6px 16px}
.btn-add-item{background:none;border:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;padding:3px 0;opacity:.7}
.btn-add-item:hover{opacity:1}
.btn-add-group{background:var(--glass-soft);border:1.5px dashed var(--sep);border-radius:12px;width:100%;padding:10px;font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .12s;margin-top:4px}
.btn-add-group:hover{border-color:var(--blue);color:var(--blue)}

.analysis-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.analysis-table{width:100%;border-collapse:collapse}
.analysis-table th{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;padding:10px 16px;background:rgba(255,255,255,.2);border-bottom:1px solid var(--sep);text-align:right;white-space:nowrap}
.analysis-table th:first-child{text-align:left}
.analysis-table td{padding:9px 16px;border-bottom:1px solid var(--sep);font-size:12px;vertical-align:middle}
.analysis-table td.r{text-align:right;font-variant-numeric:tabular-nums}
.analysis-table tr:last-child td{border-bottom:none}
.analysis-table .cost-row td{background:rgba(255,55,95,.03)}
.analysis-table .profit-row td{font-weight:800}
.cell-blue{color:var(--blue);font-weight:800}
.cell-red{color:var(--red);font-weight:800}
.cell-green{color:#30d158;font-weight:800}
.pct-chip{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700}
.pct-chip.pos{background:rgba(48,209,88,.12);color:#1a7d3a}
.pct-chip.neg{background:rgba(255,55,95,.1);color:#c0143c}

.btn-primary{background:transparent;color:var(--blue);border:1.5px solid var(--blue);border-radius:20px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:var(--blue);color:#fff}
.btn-ghost{background:var(--glass);color:var(--sub);border:1.5px solid var(--stroke);border-radius:20px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.save-indicator{font-size:11px;color:var(--faint);margin-left:8px;transition:opacity .3s}
.currency-sel{border:1.5px solid var(--sep);border-radius:8px;padding:3px 5px;font-family:inherit;font-size:11px;font-weight:800;background:var(--glass-soft);color:var(--blue);cursor:pointer;outline:none;height:28px;-webkit-appearance:none;appearance:none;text-align:center;min-width:36px}
.currency-sel:focus{border-color:var(--blue)}
.fx-bar{display:flex;align-items:center;gap:10px;padding:6px 16px 8px;font-size:11px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--sep)}
.fx-tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;color:var(--blue)}
.fx-stale{color:var(--faint)}
.item-price-cell{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.item-krw-hint{font-size:10px;color:var(--faint);font-weight:500;white-space:nowrap}
.product-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.product-tab{background:var(--glass-soft);border:1.5px solid var(--sep);border-radius:20px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.product-tab:hover{border-color:var(--blue);color:var(--blue)}
.product-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.prod-tab-qty{font-size:10px;font-weight:500;opacity:.75}
.product-tab-add{background:none;border:1.5px dashed var(--sep);border-radius:20px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:700;color:var(--faint);cursor:pointer;transition:all .12s}
.product-tab-add:hover{border-color:var(--blue);color:var(--blue)}
.product-content{background:var(--glass-soft);border:1px solid var(--sep);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.proj-summary-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
</style>

</head>

<script>
// ─────────────────── Auth ───────────────────
const _SK='noa_session_v1',_TTL=8*60*60*1000,_AUK='noa_auth_users_v1';
const _DU=[{username:'admin',hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926',name:'관리자',role:'admin'},{username:'david',hash:'2d2a6626eb7a70813ec876ad277281379a2d0d6c6e33e67f3c20d5d66452ef5e',name:'김진욱',role:'admin'},{username:'sooyoung',hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926',name:'소영',role:'user'}];
function _lu(){try{return JSON.parse(localStorage.getItem(_AUK))||_DU;}catch(e){return _DU;}}
async function _sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function _gs(){try{return JSON.parse(sessionStorage.getItem(_SK));}catch(e){return null;}}

// ─────────────────── Exchange rates ───────────────────
let FX={CNY:195,USD:1380,loadedAt:0};
async function fetchFX(){
  try{
    const r=await fetch('https://api.frankfurter.app/latest?from=USD&symbols=KRW,CNY');
    if(!r.ok)throw 0;
    const d=await r.json();
    FX.USD=d.rates.KRW;
    FX.CNY=d.rates.KRW/d.rates.CNY;
    FX.loadedAt=Date.now();
  }catch(e){console.warn('환율 로드 실패, 기본값 사용');}
  renderFXBar();
}
function toKRW(amount,currency){
  if(currency==='CNY')return amount*FX.CNY;
  if(currency==='USD')return amount*FX.USD;
  return amount;
}
function fmtFX(n){return Math.round(n).toLocaleString('ko-KR');}
function renderFXBar(){
  const el=document.getElementById('fx-bar');
  if(!el)return;
  const age=FX.loadedAt?Math.round((Date.now()-FX.loadedAt)/60000)+'분 전':'기본값';
  el.innerHTML=`<span style="color:var(--faint);font-size:10px">환율</span>
    <span class="fx-tag">¥1 = ₩${fmtFX(FX.CNY)}</span>
    <span class="fx-tag">$1 = ₩${fmtFX(FX.USD)}</span>
    <span class="fx-stale">${age}</span>
    <button onclick="fetchFX()" style="background:none;border:none;font-size:11px;color:var(--blue);cursor:pointer;font-weight:700;padding:0 4px">↻ 갱신</button>`;
}

// ─────────────────── State ───────────────────
let projects=[];
let activeId=null;
let activeProdId=null;
let saveTimer=null;

function uid(){return 'x'+Math.random().toString(36).slice(2,10);}
function won(n,abs=false){const v=abs?Math.abs(n):n;return(v<0?'-':'')+'₩'+Math.abs(Math.round(v)).toLocaleString('ko-KR');}
function pct(n){return Math.round(n*10)/10+'%';}
fetchFX();

// ─────────────────── Migration ───────────────────
function migrateProject(p){
  if(Array.isArray(p.products))return p;
  return{
    id:p.id,name:p.name,
    products:[{
      id:uid(),name:p.name||'품목 1',
      qty:p.totalQty||0,
      supplyRates:p.supplyRates||[70,80],
      msrps:p.msrps||[{id:uid(),label:'판매가 A',price:0}],
      groups:p.groups||[]
    }]
  };
}

// ─────────────────── Save/Load ───────────────────
async function saveProjects(){
  await db.collection('noa_data').doc('profit_projects').set({
    projects:JSON.stringify(projects),
    updatedAt:Date.now()
  });
  showSaveIndicator();
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveProjects(),800);}
function showSaveIndicator(){
  const el=document.getElementById('save-ind');
  if(!el)return;
  el.textContent='저장됨';el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',1500);
}

async function init(){
  try{
    const doc=await db.collection('noa_data').doc('profit_projects').get();
    if(doc.exists){
      const raw=doc.data().projects;
      const arr=typeof raw==='string'?JSON.parse(raw):(Array.isArray(raw)?raw:[]);
      projects=arr.map(migrateProject);
    }
  }catch(e){console.error(e);projects=[];}
  renderSidebar();
  if(projects.length>0)selectProject(projects[0].id);
}

// ─────────────────── Sidebar ───────────────────
function renderSidebar(){
  document.getElementById('proj-count').textContent=projects.length+'건';
  const list=document.getElementById('proj-list');
  if(projects.length===0){
    list.innerHTML=`<div style="padding:20px 12px;text-align:center;color:var(--faint);font-size:12px">프로젝트가 없습니다</div>`;
    return;
  }
  list.innerHTML=projects.map(p=>{
    const cnt=(p.products||[]).length;
    return`<div class="proj-item${activeId===p.id?' active':''}" onclick="selectProject('${p.id}')">
      <div class="proj-item-dot"></div>
      <div class="proj-item-name">${escHtml(p.name||'이름 없는 프로젝트')}</div>
      <span class="proj-qty-badge">${cnt}품목</span>
      <button class="proj-del-btn" onclick="deleteProject(event,'${p.id}')" title="삭제">×</button>
    </div>`;
  }).join('');
}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.selectProject=function(id){
  activeId=id;
  const p=projects.find(x=>x.id===id);
  activeProdId=p&&(p.products||[]).length>0?p.products[0].id:null;
  renderSidebar();renderMain();
};

window.addProject=function(){
  const prod={id:uid(),name:'품목 1',qty:0,supplyRates:[70,80],groups:[],msrps:[{id:uid(),label:'판매가 A',price:0}]};
  const p={id:uid(),name:'새 프로젝트',products:[prod]};
  projects.push(p);
  saveProjects();renderSidebar();selectProject(p.id);
};

window.deleteProject=function(e,id){
  e.stopPropagation();
  if(!confirm('프로젝트를 삭제하시겠습니까?'))return;
  projects=projects.filter(p=>p.id!==id);
  if(activeId===id){activeId=projects.length>0?projects[0].id:null;activeProdId=null;}
  saveProjects();renderSidebar();
  if(activeId)renderMain();
  else document.getElementById('main-area').innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">프로젝트를 선택하거나 추가해주세요</div></div>`;
};

function renderAnalysis(prod,unitCost){
  const msrps=(prod.msrps||[]).filter(m=>m.price>0);
  if(msrps.length===0){
    return`<div class="analysis-card" style="padding:20px;color:var(--sub);font-size:12px;text-align:center">판매가 또는 납품가를 입력하면 수익 분석이 표시됩니다</div>`;
  }

  const msrpItems=msrps.filter(m=>m.priceType!=='supply');
  const supplyItems=msrps.filter(m=>m.priceType==='supply');
  const rates=(prod.supplyRates||[]).filter(r=>r>0);
  const qty=prod.qty||0;

  let html=`<div class="analysis-card"><table class="analysis-table">`;

  // Build columns: direct supply items first (1 col each), then MSRP×rate combos
  const cols=[];
  supplyItems.forEach(m=>{
    cols.push({label:escHtml(m.label),subLabel:'직납가',supplyPrice:m.price,isSup:true});
  });
  if(msrpItems.length>0&&rates.length>0){
    msrpItems.forEach(m=>{
      rates.forEach((r,ri)=>{
        cols.push({label:escHtml(m.label),subLabel:`납품가율 ${r}%`,supplyPrice:m.price*(r/100),isSup:false,basePrice:m.price,rate:r});
      });
    });
  }

  if(cols.length===0){
    return`<div class="analysis-card" style="padding:20px;color:var(--sub);font-size:12px;text-align:center">납품가율을 추가하거나 직납가를 입력해주세요</div>`;
  }

  html+=`<thead><tr>
    <th style="text-align:left">항목</th>
    ${cols.map(c=>`<th>${c.label}</th>`).join('')}
  </tr><tr>
    <th style="color:var(--faint);font-size:9px">납품가</th>
    ${cols.map(c=>`<th style="color:${c.isSup?'#1a7d3a':'var(--blue)'}">${won(c.supplyPrice)}<br><span style="font-size:9px;font-weight:500;color:var(--faint)">${c.subLabel}</span></th>`).join('')}
  </tr></thead><tbody>`;

  // 개당 원가 row
  html+=`<tr class="cost-row"><td style="font-size:11px;color:var(--sub)">개당 원가</td>
    ${cols.map(()=>`<td class="r" style="color:var(--red);font-size:11px">${won(unitCost)}</td>`).join('')}
  </tr>`;

  // 개당 수익 row
  html+=`<tr class="profit-row"><td style="font-size:11px">개당 수익 <span style="color:var(--faint);font-weight:500">(마진율)</span></td>
    ${cols.map(c=>{
      const profit=c.supplyPrice-unitCost;
      const margin=c.supplyPrice>0?(profit/c.supplyPrice)*100:0;
      const cls=profit>=0?'cell-blue':'cell-red';
      const chipCls=margin>=0?'pos':'neg';
      return`<td class="r"><span class="${cls}">${won(profit)}</span> <span class="pct-chip ${chipCls}">${pct(margin)}</span></td>`;
    }).join('')}
  </tr>`;

  // 총 수익 row
  if(qty>0){
    html+=`<tr><td style="color:var(--sub);font-size:11px">${qty.toLocaleString()}EA 총 수익</td>
      ${cols.map(c=>{
        const profit=(c.supplyPrice-unitCost)*qty;
        const cls=profit>=0?'cell-blue':'cell-red';
        return`<td class="r"><span class="${cls}">${won(profit)}</span></td>`;
      }).join('')}
    </tr>`;
  }

  html+=`</tbody></table></div>`;
  return html;
}

// ─────────────────── Calc helpers ───────────────────
function calcGroupTotal(prod,g){
  return(g.items||[]).reduce((s,item)=>s+toKRW(item.unitPrice||0,item.currency||'KRW')*(item.qty||0),0);
}
function calcTotalCost(prod){
  return(prod.groups||[]).reduce((s,g)=>s+calcGroupTotal(prod,g),0);
}

// ─────────────────── Get helpers ───────────────────
function getProj(){return projects.find(x=>x.id===activeId);}
function getProd(pid){
  const p=getProj();if(!p)return null;
  return(p.products||[]).find(x=>x.id===(pid||activeProdId));
}

// ─────────────────── Update helpers ───────────────────
window.updateProjField=function(field,val){
  const p=getProj();if(!p)return;
  p[field]=val;
  if(field==='name')renderSidebar();
  scheduleSave();
};

window.updateProdField=function(pid,field,val){
  const prod=getProd(pid);if(!prod)return;
  if(field==='qty')prod.qty=parseFloat(val)||0;
  else prod[field]=val;
  scheduleSave();renderMain();
};

window.selectProduct=function(pid){activeProdId=pid;renderMain();};

window.addProduct=function(){
  const p=getProj();if(!p)return;
  if(!Array.isArray(p.products))p.products=[];
  const prod={id:uid(),name:'품목 '+(p.products.length+1),qty:0,supplyRates:[70,80],groups:[],msrps:[{id:uid(),label:'판매가 A',price:0}]};
  p.products.push(prod);activeProdId=prod.id;
  scheduleSave();renderSidebar();renderMain();
};

window.deleteProduct=function(pid){
  const p=getProj();if(!p)return;
  if((p.products||[]).length<=1){alert('최소 1개의 품목이 필요합니다.');return;}
  if(!confirm('품목을 삭제하시겠습니까?'))return;
  p.products=p.products.filter(x=>x.id!==pid);
  if(activeProdId===pid)activeProdId=p.products[0]?.id||null;
  scheduleSave();renderSidebar();renderMain();
};

window.updateSupplyRate=function(pid,i,val){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.supplyRates))prod.supplyRates=[];
  prod.supplyRates[i]=val;scheduleSave();renderMain();
};

window.addSupplyRate=function(pid){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.supplyRates))prod.supplyRates=[];
  if(prod.supplyRates.length<4)prod.supplyRates.push(0);
  scheduleSave();renderMain();
};

window.updateMsrp=function(pid,i,field,val){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.msrps))prod.msrps=[];
  if(field==='price'){const v=parseFloat(String(val).replace(/,/g,''))||0;prod.msrps[i].price=v;}
  else prod.msrps[i][field]=val;
  scheduleSave();renderMain();
};

window.addMsrp=function(pid){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.msrps))prod.msrps=[];
  prod.msrps.push({id:uid(),label:'판매가 '+(prod.msrps.length+1),price:0});
  scheduleSave();renderMain();
};

window.deleteMsrp=function(pid,i){
  const prod=getProd(pid);if(!prod)return;
  prod.msrps.splice(i,1);scheduleSave();renderMain();
};

window.toggleMsrpType=function(pid,i){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.msrps))return;
  const m=prod.msrps[i];if(!m)return;
  m.priceType=m.priceType==='supply'?'msrp':'supply';
  scheduleSave();renderMain();
};

window.addGroup=function(pid){
  const prod=getProd(pid);if(!prod)return;
  if(!Array.isArray(prod.groups))prod.groups=[];
  prod.groups.push({id:uid(),name:'새 공정',qty:prod.qty||0,items:[]});
  scheduleSave();renderMain();
};

window.deleteGroup=function(gid){
  const prod=getProd();if(!prod)return;
  if(!confirm('공정을 삭제하시겠습니까?'))return;
  prod.groups=prod.groups.filter(g=>g.id!==gid);
  scheduleSave();renderMain();
};

window.updateGroup=function(gid,field,val){
  const prod=getProd();if(!prod)return;
  const g=(prod.groups||[]).find(x=>x.id===gid);if(!g)return;
  g[field]=val;scheduleSave();renderMain();
};

window.toggleGroup=function(gid){
  const body=document.getElementById('gb-'+gid);
  const icon=document.getElementById('gt-'+gid);
  if(!body)return;
  const hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  icon.textContent=hidden?'▼':'▶';
};

window.addItem=function(gid){
  const prod=getProd();if(!prod)return;
  const g=(prod.groups||[]).find(x=>x.id===gid);if(!g)return;
  if(!Array.isArray(g.items))g.items=[];
  g.items.push({id:uid(),name:'',unitPrice:0,qty:g.qty||0,currency:'KRW'});
  scheduleSave();renderMain();
};

window.deleteItem=function(gid,ii){
  const prod=getProd();if(!prod)return;
  const g=(prod.groups||[]).find(x=>x.id===gid);if(!g)return;
  g.items.splice(ii,1);scheduleSave();renderMain();
};

window.updateItem=function(gid,ii,field,val){
  const prod=getProd();if(!prod)return;
  const g=(prod.groups||[]).find(x=>x.id===gid);if(!g)return;
  const item=g.items[ii];if(!item)return;
  if(field==='unitPrice'||field==='qty'){
    item[field]=parseFloat(String(val).replace(/,/g,''))||0;
  }else{item[field]=val;}
  scheduleSave();renderMain();
};

window.copyProject=function(id){
  const src=projects.find(p=>p.id===id);if(!src)return;
  const copy=JSON.parse(JSON.stringify(src));
  copy.id=uid();copy.name=src.name+' (복사)';
  (copy.products||[]).forEach(prod=>{
    prod.id=uid();
    (prod.groups||[]).forEach(g=>{g.id=uid();(g.items||[]).forEach(item=>item.id=uid());});
    (prod.msrps||[]).forEach(m=>m.id=uid());
  });
  projects.push(copy);saveProjects();renderSidebar();selectProject(copy.id);
};
</script>
</body>
