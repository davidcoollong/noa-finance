<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;font-size:14px;background:#F3F4F6;color:#000;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
#auth-overlay{position:fixed;inset:0;background:rgba(4,50,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:#fff;border-radius:24px;padding:44px 40px 36px;width:380px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 64px rgba(0,0,0,.18);text-align:center}
.auth-brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:rgba(4,50,255,.5);text-transform:uppercase;margin-bottom:8px}

.auth-field{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:12px 16px;font-family:inherit;font-size:14px;font-weight:500;color:#111;outline:none;transition:border-color .15s;margin-bottom:10px;background:#FAFAFA}
.auth-field:focus{border-color:#0432FF;background:#fff;box-shadow:0 0 0 3px rgba(4,50,255,.1)}
.auth-btn{width:100%;background:#0432FF;color:#fff;border:none;border-radius:10px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s}
.auth-btn:hover{opacity:.88}
.auth-err{font-size:12px;color:#FF3B30;margin-top:10px;min-height:16px;font-weight:500}
.auth-footer{font-size:11px;color:#9CA3AF;margin-top:20px}
.cross-nav{background:#fff;border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;gap:2px;height:38px;padding:0 16px;position:sticky;top:0;z-index:400;box-shadow:0 1px 0 rgba(0,0,0,.04)}

.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:#fff}
.user-badge .dot{width:7px;height:7px;background:#34C759;border-radius:50%;flex-shrink:0}
.btn-logout{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-family:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(255,255,255,.2);color:#fff}
.page-wrapper{max-width:1100px;margin:28px auto;padding:0 24px 80px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
.page-actions{display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.01em;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#0432FF;color:#fff}
.btn-ghost{background:#fff;color:#374151;border:1.5px solid #E5E7EB}
.btn-ghost:hover{border-color:#0432FF;color:#0432FF;opacity:1}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-label{font-size:10px;font-weight:700;color:#9CA3AF;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:800;letter-spacing:-1px}

.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav button{background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#374151;transition:all .12s}

.search-input{flex:1;min-width:140px;border:1.5px solid #E5E7EB;border-radius:10px;padding:8px 13px;font-family:inherit;font-size:13px;outline:none;background:#fff;transition:border-color .15s}

table{width:100%;border-collapse:collapse}
th{background:#F9FAFB;font-size:11px;font-weight:700;color:#6B7280;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid #F3F4F6}
th.right{text-align:right}
td{padding:10px 14px;border-bottom:1px solid #F3F4F6;font-size:13px;font-weight:500;color:#111;vertical-align:middle}

tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}
.profit-pos{color:#059669;font-weight:700}
.profit-neg{color:#DC2626;font-weight:700}
.margin-bar-wrap{display:flex;align-items:center;gap:6px}
.margin-bar{height:6px;border-radius:3px;background:#E5E7EB;width:80px;overflow:hidden;flex-shrink:0}
.margin-fill{height:100%;border-radius:3px;background:#10B981}

.margin-pct{font-size:11px;font-weight:700;min-width:36px}
.tfoot-row td{background:#F9FAFB;font-weight:700;border-top:2px solid #E5E7EB}
.empty-row td{text-align:center;padding:40px;color:#9CA3AF}
.table-actions{display:flex;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;color:#9CA3AF;transition:background .1s}
.icon-btn:hover{background:#F3F4F6;color:#374151}
/* year summary */
.year-section{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.year-title{font-size:13px;font-weight:700;letter-spacing:.05em;color:#6B7280;text-transform:uppercase;margin-bottom:14px}
.month-bars{display:flex;gap:6px;align-items:flex-end;height:80px}
.mbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.mbar{width:100%;border-radius:4px 4px 0 0;background:#EEF2FF;min-height:2px;transition:height .3s}
.mbar.has-data{background:#0432FF}
.mbar-label{font-size:9px;font-weight:600;color:#9CA3AF}
.mbar-val{font-size:9px;font-weight:700;color:#374151}
#item-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:5000;align-items:center;justify-content:center;padding:20px}
#item-modal.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:32px 28px;width:460px;box-shadow:0 12px 48px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:20px}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:#6B7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input{width:100%;border:1.5px solid #E5E7EB;border-radius:9px;padding:9px 13px;font-family:inherit;font-size:13px;font-weight:500;color:#111;outline:none;transition:border-color .15s;background:#FAFAFA}
.form-input:focus{border-color:#0432FF;background:#fff;box-shadow:0 0 0 3px rgba(4,50,255,.08)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.profit-preview{background:#F0FDF4;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;color:#059669;margin-bottom:12px;text-align:center}
</style>

<script>
const _SESSION_KEY='noa_session_v1',_SESSION_TTL=8*60*60*1000,_AUTH_USERS_KEY='noa_auth_users_v1';
const _DEFAULT_USERS=[{username:'admin',hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926',name:'관리자',role:'admin'},{username:'david',hash:'2d2a6626eb7a70813ec876ad277281379a2d0d6c6e33e67f3c20d5d66452ef5e',name:'김진욱',role:'admin'},{username:'sooyoung',hash:'9fa1c66b467a1b984e7493e1409d57aa4e9b61f169c131ef6fab89f5c57fc926',name:'소영',role:'user'}];
function _loadUsers(){try{return JSON.parse(localStorage.getItem(_AUTH_USERS_KEY))||_DEFAULT_USERS;}catch(e){return _DEFAULT_USERS;}}
async function _sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function _getSession(){try{return JSON.parse(sessionStorage.getItem(_SESSION_KEY));}catch(e){return null;}}
function _setSession(user){sessionStorage.setItem(_SESSION_KEY,JSON.stringify({username:user.username,name:user.name,role:user.role,expires:Date.now()+_SESSION_TTL}));}
function _showUser(name){const ov=document.getElementById('auth-overlay');if(ov)ov.remove();document.getElementById('user-name-display').textContent=name;init();}
window.doLogin=async function(){const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;if(!u||!p){document.getElementById('auth-err').textContent='아이디와 비밀번호를 입력해주세요.';return;}const h=await _sha256(p);const user=_loadUsers().find(x=>x.username===u&&x.hash===h);if(user){_setSession(user);_showUser(user.name);}else{document.getElementById('auth-err').textContent='아이디 또는 비밀번호가 올바르지 않습니다.';document.getElementById('auth-pass').value='';}};
window.doLogout=function(){if(confirm('로그아웃 하시겠습니까?')){sessionStorage.removeItem(_SESSION_KEY);location.reload();}};
(function(){const s=_getSession();if(s&&Date.now()<s.expires)_showUser(s.name);})();

const _FB_CFG={apiKey:"AIzaSyBvLd4BtsmxTe2P0ZTNTBLmYTQPQGtCwYg",authDomain:"noaark-f8f75.firebaseapp.com",projectId:"noaark-f8f75",storageBucket:"noaark-f8f75.firebasestorage.app",messagingSenderId:"120494768831",appId:"1:120494768831:web:placeholder"};
if(!firebase.apps.length)firebase.initializeApp(_FB_CFG);
const db=firebase.firestore();

let records=[];
let editId=null;
let viewMonth=new Date().toISOString().slice(0,7);

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return'₩'+(Math.round(n)||0).toLocaleString('ko-KR');}
function fmtPct(n){return(n||0).toFixed(1)+'%';}

async function save(){await db.collection('noa_data').doc('revenue').set({records,updatedAt:new Date().toISOString()});}

async function init(){
  try{const doc=await db.collection('noa_data').doc('revenue').get();records=doc.exists?(doc.data().records||[]):[];}catch(e){records=[];}
  updateMonthDisplay();
  updateStats();
  renderTable();
  renderYearBars();
}

function updateMonthDisplay(){
  const [y,m]=viewMonth.split('-');
  document.getElementById('month-display').textContent=`${y}년 ${m}월`;
}

window.changeMonth=function(d){
  const [y,m]=viewMonth.split('-').map(Number);
  const dt=new Date(y,m-1+d,1);
  viewMonth=dt.toISOString().slice(0,7);
  updateMonthDisplay();
  updateStats();
  renderTable();
};

function getMonthRec(month){return records.filter(r=>r.date&&r.date.startsWith(month));}

function updateStats(){
  const mt=getMonthRec(viewMonth);
  const totalRev=mt.reduce((s,r)=>s+(r.revenue||0),0);
  const totalCost=mt.reduce((s,r)=>s+(r.cost||0),0);
  const totalProfit=mt.reduce((s,r)=>s+(r.profit||0),0);
  const margin=totalRev>0?(totalProfit/totalRev*100):0;
  document.getElementById('s-rev').textContent=fmt(totalRev);
  document.getElementById('s-rev-cnt').textContent=`${mt.length}건`;
  document.getElementById('s-cost').textContent=fmt(totalCost);
  const profEl=document.getElementById('s-profit');
  profEl.textContent=fmt(totalProfit);
  profEl.style.color=totalProfit>=0?'#059669':'#DC2626';
  document.getElementById('s-margin').textContent=`이익률 ${fmtPct(margin)}`;
  const year=viewMonth.slice(0,4);
  const yearRec=records.filter(r=>r.date&&r.date.startsWith(year));
  const yearRev=yearRec.reduce((s,r)=>s+(r.revenue||0),0);
  const yearProfit=yearRec.reduce((s,r)=>s+(r.profit||0),0);
  document.getElementById('s-year-rev').textContent=fmt(yearRev);
  const ypEl=document.getElementById('s-year-profit');
  ypEl.textContent=`순이익 ${fmt(yearProfit)}`;
  ypEl.style.color=yearProfit>=0?'#059669':'#DC2626';
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const mt=getMonthRec(viewMonth).filter(r=>{
    return!q||(r.project||'').toLowerCase().includes(q)||(r.client||'').toLowerCase().includes(q);
  }).sort((a,b)=>b.date.localeCompare(a.date));
  const tbody=document.getElementById('rev-tbody');
  const tfoot=document.getElementById('rev-tfoot');
  if(!mt.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="9">이 달에 등록된 프로젝트가 없습니다.</td></tr>';
    tfoot.innerHTML='';
    return;
  }
  tbody.innerHTML=mt.map(r=>{
    const profit=r.profit||0;
    const margin=r.revenue>0?(profit/r.revenue*100):0;
    const marginPct=Math.max(0,Math.min(100,margin));
    return`<tr>
      <td style="white-space:nowrap;font-weight:700">${r.date||''}</td>
      <td style="font-weight:700">${esc(r.project)}</td>
      <td style="color:#6B7280">${esc(r.client||'-')}</td>
      <td class="right">${fmt(r.revenue||0)}</td>
      <td class="right" style="color:#DC2626">${fmt(r.cost||0)}</td>
      <td class="right ${profit>=0?'profit-pos':'profit-neg'}">${fmt(profit)}</td>
      <td>
        <div class="margin-bar-wrap">
          <div class="margin-bar"><div class="margin-fill ${profit<0?'neg':''}" style="width:${marginPct}%"></div></div>
          <span class="margin-pct ${profit>=0?'profit-pos':'profit-neg'}">${margin.toFixed(1)}%</span>
        </div>
      </td>
      <td style="color:#9CA3AF">${esc(r.memo||'')}</td>
      <td><div class="table-actions">
        <button class="icon-btn" onclick="editItem('${r.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteItem('${r.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
  // Footer totals
  const sumRev=mt.reduce((s,r)=>s+(r.revenue||0),0);
  const sumCost=mt.reduce((s,r)=>s+(r.cost||0),0);
  const sumProfit=mt.reduce((s,r)=>s+(r.profit||0),0);
  const sumMargin=sumRev>0?(sumProfit/sumRev*100):0;
  tfoot.innerHTML=`<tr class="tfoot-row">
    <td colspan="3">합계 (${mt.length}건)</td>
    <td class="right">${fmt(sumRev)}</td>
    <td class="right" style="color:#DC2626">${fmt(sumCost)}</td>
    <td class="right ${sumProfit>=0?'profit-pos':'profit-neg'}">${fmt(sumProfit)}</td>
    <td><span class="${sumProfit>=0?'profit-pos':'profit-neg'}">${sumMargin.toFixed(1)}%</span></td>
    <td colspan="2"></td>
  </tr>`;
}

function renderYearBars(){
  const year=viewMonth.slice(0,4);
  document.getElementById('year-title').textContent=`${year}년 월별 매출 추이`;
  const months=Array.from({length:12},(_,i)=>(i+1).toString().padStart(2,'0'));
  const monthRevs=months.map(m=>records.filter(r=>r.date&&r.date.startsWith(`${year}-${m}`)).reduce((s,r)=>s+(r.revenue||0),0));
  const maxRev=Math.max(...monthRevs,1);
  document.getElementById('month-bars').innerHTML=months.map((m,i)=>{
    const rev=monthRevs[i];
    const h=Math.max(2,Math.round(rev/maxRev*70));
    const hasData=rev>0;
    const label=`${parseInt(m)}월`;
    const val=rev>0?'₩'+(rev/10000).toFixed(0)+'만':'';
    return`<div class="mbar-wrap">
      <div class="mbar-val">${val}</div>
      <div class="mbar ${hasData?'has-data':''}" style="height:${h}px"></div>
      <div class="mbar-label">${label}</div>
    </div>`;
  }).join('');
}

window.updateProfit=function(){
  const rev=parseFloat(document.getElementById('f-revenue').value)||0;
  const cost=parseFloat(document.getElementById('f-cost').value)||0;
  const profit=rev-cost;
  const margin=rev>0?(profit/rev*100):0;
  const el=document.getElementById('profit-preview');
  el.textContent=`순이익: ${fmt(profit)} (이익률 ${margin.toFixed(1)}%)`;
  el.style.background=profit>=0?'#F0FDF4':'#FFF1F2';
  el.style.color=profit>=0?'#059669':'#DC2626';
};

window.openModal=function(id=null){
  editId=id;
  document.getElementById('modal-title').textContent=id?'프로젝트 수정':'프로젝트 추가';
  const today=new Date().toISOString().slice(0,10);
  if(id){
    const r=records.find(x=>x.id===id);if(!r)return;
    document.getElementById('f-date').value=r.date||today;
    document.getElementById('f-client').value=r.client||'';
    document.getElementById('f-project').value=r.project||'';
    document.getElementById('f-revenue').value=r.revenue||0;
    document.getElementById('f-cost').value=r.cost||0;
    document.getElementById('f-memo').value=r.memo||'';
  } else {
    document.getElementById('f-date').value=today;
    document.getElementById('f-client').value='';
    document.getElementById('f-project').value='';
    document.getElementById('f-revenue').value='';
    document.getElementById('f-cost').value='';
    document.getElementById('f-memo').value='';
  }
  updateProfit();
  document.getElementById('item-modal').classList.add('open');
  document.getElementById('f-project').focus();
};
window.closeModal=function(){document.getElementById('item-modal').classList.remove('open');};
window.editItem=function(id){openModal(id);};

window.saveItem=async function(){
  const project=document.getElementById('f-project').value.trim();
  const date=document.getElementById('f-date').value;
  const revenue=parseFloat(document.getElementById('f-revenue').value)||0;
  if(!project||!date){alert('날짜와 프로젝트명을 입력해주세요.');return;}
  const cost=parseFloat(document.getElementById('f-cost').value)||0;
  const profit=revenue-cost;
  const data={id:editId||genId(),date,project,client:document.getElementById('f-client').value.trim(),revenue,cost,profit,memo:document.getElementById('f-memo').value.trim(),createdAt:editId?(records.find(r=>r.id===editId)||{}).createdAt||new Date().toISOString():new Date().toISOString()};
  if(editId){const idx=records.findIndex(r=>r.id===editId);if(idx>=0)records[idx]=data;}
  else records.push(data);
  await save();
  closeModal();
  updateStats();
  renderTable();
  renderYearBars();
};

window.deleteItem=async function(id){
  if(!confirm('이 프로젝트를 삭제하시겠습니까?'))return;
  records=records.filter(r=>r.id!==id);
  await save();
  updateStats();
  renderTable();
  renderYearBars();
};

window.exportCSV=function(){
  const header='날짜,프로젝트명,거래처,매출,비용,순이익,이익률,메모';
  const rows=records.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{
    const margin=r.revenue>0?((r.profit||0)/r.revenue*100):0;
    return[r.date,r.project,r.client||'',r.revenue||0,r.cost||0,r.profit||0,margin.toFixed(1)+'%',r.memo||''].join(',');
  });
  const blob=new Blob(['﻿'+header+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='수익관리_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};

document.getElementById('item-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
</body>
</html>
